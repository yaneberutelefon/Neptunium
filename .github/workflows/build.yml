name: Build Neptunium
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build/Neptunium_artefacts/Release/VST3/Neptunium.vst3" dist/
          Copy-Item "build/Neptunium_artefacts/Release/Standalone/Neptunium.exe" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: Neptunium-Windows
          path: dist
